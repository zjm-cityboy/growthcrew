# GrowthCrew 本地部署编排（Docker Desktop / 单机）：db + backend + frontend
# 一键启动：Windows 双击 setup.bat（内部调用 setup.ps1）；macOS/Linux 运行 ./setup.sh
# 手动步骤与常见问题见项目根目录 DEPLOY.md
# 服务器 + 域名 + HTTPS 模式见 docker-compose.server.yml 与 runbook.md
name: growthcrew

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    # 启动即幂等迁移（alembic 已应用的版本自动跳过），无需手动执行
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      GC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GC_ENV: ${GC_ENV}
      GC_JWT_SECRET: ${GC_JWT_SECRET}
      GC_CORS_ORIGINS: ${GC_CORS_ORIGINS}
      GC_ENCRYPTION_KEY: ${GC_ENCRYPTION_KEY}
      GC_ADMIN_USERNAMES: ${GC_ADMIN_USERNAMES:-[]}
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      # 宿主端口刻意避开 3031-3130 一类 Windows/Hyper-V 动态保留段
      # （Docker 绑定时会报 access permissions denied）；撞上见 DEPLOY.md FAQ
      - "3211:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    name: growthcrew_local_pgdata
