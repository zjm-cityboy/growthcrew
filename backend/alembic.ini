[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The database URL is injected by env.py from app settings (GC_DATABASE_URL).
# Keep this file ASCII-only: logging.config reads it with the OS default
# encoding, which is GBK on Windows and breaks on non-ASCII comments.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
